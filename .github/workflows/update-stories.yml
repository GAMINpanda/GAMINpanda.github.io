name: Update stories.json

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch stories from Wattpad
        run: node scripts/fetch-stories.mjs

      - name: Commit changes
        run: |
          if git diff --quiet stories.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stories.json
          git commit -m "chore: update stories.json from Wattpad"
          git push
